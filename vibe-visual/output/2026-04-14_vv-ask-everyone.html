<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>vv — If you want to make the wrong decision, ask everyone.</title>
  <style>
    :root {
      --vv-bg:     #000000;
      --vv-stroke: #ffffff;
      --vv-text:   #ffffff;
      --vv-fill:   #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; gap: 18px;
      font-family: 'Courier New', monospace;
    }
    #artwork {
      width: 540px; height: 540px;
      display: block;
    }
    .controls { display: flex; gap: 10px; align-items: center; }
    button {
      background: #1a1a1a; color: #888; border: 1px solid #2a2a2a;
      padding: 8px 20px; border-radius: 3px; cursor: pointer;
      font-family: 'Courier New', monospace; font-size: 10px;
      letter-spacing: 3px; text-transform: uppercase;
      transition: all 0.15s;
    }
    button:hover { color: #fff; border-color: #555; background: #222; }
    .info { color: #2a2a2a; font-size: 10px; letter-spacing: 2px; }
  </style>
</head>
<body>

  <svg id="artwork" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">

    <!-- Background -->
    <rect width="1080" height="1080" fill="var(--vv-bg)"/>

    <!--
      P9 — Speech Bubble Grid
      "If you want to make the wrong decision, ask everyone." — Naval Ravikant

      3×3 grid of speech bubbles at:
      Row 1: (200,300) (430,300) (660,300)
      Row 2: (200,490) (430,490) (660,490)
      Row 3: (200,680) (430,680) (660,680)

      Each bubble: 90px wide × 62px tall rect + tail + inner arrow
      9 unique arrow directions representing conflicting opinions
    -->

    <!-- ===== ROW 1 ===== -->

    <!-- Bubble 1,1 — Arrow ↑ (up) -->
    <g transform="translate(155, 269)">
      <rect x="0" y="0" width="90" height="62"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" rx="3"/>
      <!-- tail: pointing down-left -->
      <polygon points="30,62 46,62 38,78"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- arrow ↑ -->
      <line x1="45" y1="50" x2="45" y2="18" stroke="var(--vv-stroke)" stroke-width="1.3"/>
      <polygon points="39,24 45,12 51,24" fill="var(--vv-fill)" stroke="none"/>
    </g>

    <!-- Bubble 1,2 — Arrow ↖ (up-left) -->
    <g transform="translate(385, 269)">
      <rect x="0" y="0" width="90" height="62"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" rx="3"/>
      <polygon points="30,62 46,62 38,78"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- arrow ↖ -->
      <line x1="58" y1="48" x2="30" y2="18" stroke="var(--vv-stroke)" stroke-width="1.3"/>
      <polygon points="24,28 22,12 36,18" fill="var(--vv-fill)" stroke="none"/>
    </g>

    <!-- Bubble 1,3 — Arrow ↗ (up-right) -->
    <g transform="translate(615, 269)">
      <rect x="0" y="0" width="90" height="62"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" rx="3"/>
      <polygon points="30,62 46,62 38,78"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- arrow ↗ -->
      <line x1="32" y1="48" x2="60" y2="18" stroke="var(--vv-stroke)" stroke-width="1.3"/>
      <polygon points="54,28 68,12 66,28" fill="var(--vv-fill)" stroke="none"/>
    </g>

    <!-- ===== ROW 2 ===== -->

    <!-- Bubble 2,1 — Arrow ← (left) -->
    <g transform="translate(155, 459)">
      <rect x="0" y="0" width="90" height="62"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" rx="3"/>
      <polygon points="30,62 46,62 38,78"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- arrow ← -->
      <line x1="68" y1="31" x2="24" y2="31" stroke="var(--vv-stroke)" stroke-width="1.3"/>
      <polygon points="30,25 16,31 30,37" fill="var(--vv-fill)" stroke="none"/>
    </g>

    <!-- Bubble 2,2 — Arrow ↙ (down-left) [center bubble] -->
    <g transform="translate(385, 459)">
      <rect x="0" y="0" width="90" height="62"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" rx="3"/>
      <polygon points="30,62 46,62 38,78"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- arrow ↙ -->
      <line x1="62" y1="15" x2="30" y2="47" stroke="var(--vv-stroke)" stroke-width="1.3"/>
      <polygon points="24,41 20,55 34,47" fill="var(--vv-fill)" stroke="none"/>
    </g>

    <!-- Bubble 2,3 — Arrow ↘ (down-right) -->
    <g transform="translate(615, 459)">
      <rect x="0" y="0" width="90" height="62"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" rx="3"/>
      <polygon points="30,62 46,62 38,78"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- arrow ↘ -->
      <line x1="28" y1="15" x2="60" y2="47" stroke="var(--vv-stroke)" stroke-width="1.3"/>
      <polygon points="54,41 70,55 56,47" fill="var(--vv-fill)" stroke="none"/>
    </g>

    <!-- ===== ROW 3 ===== -->

    <!-- Bubble 3,1 — Arrow ↓ (down) -->
    <g transform="translate(155, 649)">
      <rect x="0" y="0" width="90" height="62"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" rx="3"/>
      <polygon points="30,62 46,62 38,78"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- arrow ↓ -->
      <line x1="45" y1="14" x2="45" y2="48" stroke="var(--vv-stroke)" stroke-width="1.3"/>
      <polygon points="39,42 45,56 51,42" fill="var(--vv-fill)" stroke="none"/>
    </g>

    <!-- Bubble 3,2 — Arrow → (right) flipped direction -->
    <g transform="translate(385, 649)">
      <rect x="0" y="0" width="90" height="62"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" rx="3"/>
      <polygon points="30,62 46,62 38,78"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- arrow → -->
      <line x1="22" y1="31" x2="66" y2="31" stroke="var(--vv-stroke)" stroke-width="1.3"/>
      <polygon points="60,25 74,31 60,37" fill="var(--vv-fill)" stroke="none"/>
    </g>

    <!-- Bubble 3,3 — Arrow ↖ variant (up-left variant for asymmetry) -->
    <g transform="translate(615, 649)">
      <rect x="0" y="0" width="90" height="62"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" rx="3"/>
      <polygon points="30,62 46,62 38,78"
        fill="none" stroke="var(--vv-stroke)" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- arrow ↑ right-leaning -->
      <line x1="56" y1="50" x2="34" y2="15" stroke="var(--vv-stroke)" stroke-width="1.3"/>
      <polygon points="28,25 26,9 40,18" fill="var(--vv-fill)" stroke="none"/>
    </g>

    <!-- Attribution text bottom -->
    <text x="540" y="920"
      text-anchor="middle"
      fill="var(--vv-text)"
      font-family="'Courier New', monospace"
      font-size="11"
      letter-spacing="3"
      opacity="0.5">NAVAL RAVIKANT</text>

  </svg>

  <div class="controls">
    <button onclick="toggleTheme()">◑  THEME</button>
    <button onclick="downloadPNG()">DOWNLOAD  PNG</button>
  </div>
  <div class="info" id="info">1080 × 1080  ·  DARK  ·  P9 — SPEECH BUBBLE GRID</div>

  <script>
  let isDark = true;

  function toggleTheme() {
    isDark = !isDark;
    const r = document.documentElement;
    if (isDark) {
      r.style.setProperty('--vv-bg',     '#000000');
      r.style.setProperty('--vv-stroke', '#ffffff');
      r.style.setProperty('--vv-text',   '#ffffff');
      r.style.setProperty('--vv-fill',   '#ffffff');
      document.getElementById('info').textContent = '1080 × 1080  ·  DARK  ·  P9 — SPEECH BUBBLE GRID';
    } else {
      r.style.setProperty('--vv-bg',     '#ffffff');
      r.style.setProperty('--vv-stroke', '#000000');
      r.style.setProperty('--vv-text',   '#000000');
      r.style.setProperty('--vv-fill',   '#000000');
      document.getElementById('info').textContent = '1080 × 1080  ·  LIGHT  ·  P9 — SPEECH BUBBLE GRID';
    }
  }

  function downloadPNG() {
    const svg = document.getElementById('artwork');
    const bg     = isDark ? '#000000' : '#ffffff';
    const stroke = isDark ? '#ffffff' : '#000000';
    const fill   = isDark ? '#ffffff' : '#000000';

    const svgStr = svg.outerHTML
      .replace(/var\(--vv-bg\)/g,     bg)
      .replace(/var\(--vv-stroke\)/g, stroke)
      .replace(/var\(--vv-text\)/g,   stroke)
      .replace(/var\(--vv-fill\)/g,   fill);

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 1080;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' }));
    img.onload = () => {
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1080, 1080);
      ctx.drawImage(img, 0, 0, 1080, 1080);
      const a = document.createElement('a');
      a.download = 'vv-ask-everyone-' + (isDark ? 'dark' : 'light') + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }
  </script>

</body>
</html>
